runs:
  using: "composite"
  steps:
    - name: Upload cachekeys to CI artifacts
      uses: https://data.forgejo.org/forgejo/upload-artifact@v4
      with:
        name: cachekeys-${{ forgejo.run_id }}
        path: cachekeys
        if-no-files-found: error
        compression-level: 9
        retention-days: 1
        overwrite: true

    # See https://code.forgejo.org/actions/download-artifact#maintaining-file-permissions
    - name: Create tar archive to conserve permissions
      run: |
        time tar --lzop -cvpf target.tar target/ 1>/dev/null
        ls -lh target.tar
        echo "Target compressed"

    - name: Upload target directory to CI artifacts
      uses: https://data.forgejo.org/forgejo/upload-artifact@v4
      with:
        name: target-dir-${{ forgejo.run_id }}
        path: target.tar
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
        overwrite: true

    - name: Create tar archive to conserve permissions
      run: |
        time tar --lzop -cvpf cargohome.tar .cargohome/registry .cargohome/advisory-db 1>/dev/null
        ls -lh cargohome.tar
        echo "Target compressed"

    - name: Upload cargo home registry to CI artifacts
      uses: https://data.forgejo.org/forgejo/upload-artifact@v4
      with:
        name: cargo-home-${{ forgejo.run_id }}
        path: cargohome.tar
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
        overwrite: true
