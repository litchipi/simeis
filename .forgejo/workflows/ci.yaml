name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

# TODO (#62) Make code check first, in parallel with TODO checks and SDK checks
# Then launch tests, func tests, api & swagger generation

# TODO (#62) Create a CD:
# When label "release" on the PR, and PR is merged
# Create a debian package, then publish it as an artifact

jobs:
  tests:
    runs-on: nix
    needs: code-check
    steps:
      - uses: actions/checkout@v4

      - name: Calculate versions
        id: cachekey
        run: |
          echo "hash=$(md5sum Cargo.lock | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT
          nix run .#disp_version >> $GITHUB_OUTPUT

      - uses: https://code.forgejo.org/actions/cache@v6
        name: Cache dependencies
        id: cache-rust
        with:
          path: |
            .cargohome/registry/index/
            .cargohome/registry/cache/
            .cargohome/git/db/
            target/
            supply-chain/
          key: ${{ runner.os }}-tests-${{ steps.cachekey.outputs.hash }}-${{ steps.cachekey.outputs.simeis-version }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.cachekey.outputs.hash }}
            ${{ runner.os }}-${{ steps.cachekey.outputs.simeis-version }}

      - name: "Unit tests"
        run: nix run .#unit_tests --show-trace -L

      - name: "Functional tests"
        run: nix run .#functional_tests --show-trace -L

  api-check:
    runs-on: nix
    needs: code-check
    steps:
      - uses: actions/checkout@v4

      - name: Calculate lockfile hash
        id: cachekey
        run: |
          echo "hash=$(md5sum Cargo.lock | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT
          nix run .#disp_version >> $GITHUB_OUTPUT
      - uses: https://code.forgejo.org/actions/cache@v6
        name: Cache dependencies
        id: cache-rust
        with:
          path: |
            .cargohome/registry/index/
            .cargohome/registry/cache/
            .cargohome/git/db/
            target/
            supply-chain/
          key: ${{ runner.os }}-tests-${{ steps.cachekey.outputs.hash }}-${{ steps.cachekey.outputs.simeis-version }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.cachekey.outputs.hash }}
            ${{ runner.os }}-${{ steps.cachekey.outputs.simeis-version }}

      - name: "Check if SDKs are in sync"
        run: nix run .#check_sdk_sync --show-trace -L
      - name: "Check if swagger and SDKs are in sync with API"
        run: nix run .#api_sanity --show-trace -L

  code-check:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4

      - name: Calculate lockfile hash
        id: cachekey
        run: |
          echo "hash=$(md5sum Cargo.lock | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT
          nix run .#disp_version >> $GITHUB_OUTPUT
      - uses: https://code.forgejo.org/actions/cache@v6
        name: Cache dependencies
        id: cache-rust
        with:
          path: |
            .cargohome/registry/index/
            .cargohome/registry/cache/
            .cargohome/git/db/
            target/
            supply-chain/
          key: ${{ runner.os }}-tests-${{ steps.cachekey.outputs.hash }}-${{ steps.cachekey.outputs.simeis-version }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.cachekey.outputs.hash }}
            ${{ runner.os }}-${{ steps.cachekey.outputs.simeis-version }}

      - name: "Check the sanity of the Rust code"
        run: nix run .#check_rust_code

  todo-check:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: "Check for unadressed TODOs"
        run: nix run .#check_todos

  check-runs-well:
    runs-on: nix
    needs: code-check
    steps:
      - uses: actions/checkout@v4

      - name: Calculate lockfile hash
        id: cachekey
        run: |
          echo "hash=$(md5sum Cargo.lock | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT
          nix run .#disp_version >> $GITHUB_OUTPUT

      - uses: https://code.forgejo.org/actions/cache@v6
        name: Cache dependencies
        id: cache-rust
        with:
          path: |
            .cargohome/registry/index/
            .cargohome/registry/cache/
            .cargohome/git/db/
            target/
            supply-chain/
          key: ${{ runner.os }}-tests-${{ steps.cachekey.outputs.hash }}-${{ steps.cachekey.outputs.simeis-version }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.cachekey.outputs.hash }}
            ${{ runner.os }}-${{ steps.cachekey.outputs.simeis-version }}

      - name: "Check if Python base client runs well"
        run: nix run .#client_run_well_py

      - name: "Check if Rust base client runs well"
        run: nix run .#client_run_well_rs
