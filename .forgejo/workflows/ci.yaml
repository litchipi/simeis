name: CI

on:
  push:
    branches:
      - bot/*
  pull_request:
    types: [opened, synchronize, reopened]

# TODO (#62) Create a CD:
# When label "release" on the PR, and PR is merged
# Create a debian package, then publish it as an artifact

jobs:
  ci-check:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4

      - uses: ./.forgejo/actions/rust-cache
        with:
          key: ci-check
          srcdir: simeis-data simeis-server

      - name: "Check the sanity of the Rust code"
        run: nix run .#check_rust_code

  quick-sanity-check:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: "Check for unadressed TODOs"
        run: nix run .#check_todos
      - name: "Check if SDKs are in sync"
        run: nix run .#check_sdk_sync --show-trace -L
