name: CI-Build-Release

on:
  pull_request:
    branches: [main]

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock', '**/*.rs') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - uses: dtolnay/rust-toolchain@stable
      - run: make build-release

  compile-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Typst
        uses: actions/cache@v4
        with:
          path: ~/.cache/typst
          key: ${{ runner.os }}-typst-${{ hashFiles('**/*.typ') }}
          restore-keys: ${{ runner.os }}-typst-

      - uses: typst-community/setup-typst@v4
      - run: make modify-typ

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock', '**/*.rs') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - uses: dtolnay/rust-toolchain@stable
      - run: make tests

  check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock', '**/*.rs') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - uses: dtolnay/rust-toolchain@stable
      - run: make check