name: CI-Release-PR-Check

on:
  pull_request:
    branches:
      - release/**  # Trigger on all release branch targeted by PR

concurrency:
  group: release-pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check Source Branch
        shell: bash
        run: |
          SOURCE_BRANCH=${{ github.head_ref }}
          echo "Source branch: $SOURCE_BRANCH"
          
          if [[ "$SOURCE_BRANCH" == "main" ]] || [[ "$SOURCE_BRANCH" =~ ^fix/ ]]; then
            echo "Valid branch"
            exit 0
          else
            echo "Error: Pull Requests to 'release' must come from 'main' or 'fix/*' branches."
            # Set branch to red
            exit 1
          fi